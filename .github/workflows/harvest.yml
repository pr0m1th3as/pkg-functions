name: Harvest package functions

on:
  schedule:
    # Hourly.  The index republishes on every push to the packages repository
    # and on its own 01:00 cron, so a release is measured within the hour of
    # being listed.  Polling this often is affordable because a run that finds
    # nothing changed costs one short job and nothing else: plan.py skips any
    # release whose checksum it already holds, and the harvest is gated on the
    # plan coming back non-empty.
    #
    # The alternative is for the packages repository to fire a
    # repository_dispatch once its site has deployed, which would cut the delay
    # to minutes.  That needs a token with write access to this repository
    # stored in theirs, expiring within the year, and a silent failure there
    # would stop harvesting here with no signal.  This is cheaper and answers
    # to nobody.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space separated package names; empty harvests all'
        required: false
        default: ''
      force:
        description: 'Re-harvest even when the checksum is unchanged'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # Pinned by digest, and deliberately not by tag.  What "core Octave" means to
  # this data set is whatever the container answers to, so the image is not
  # merely where the harvest runs -- it is the measurement's reference.  A tag
  # can be re-pushed on a newer base without the Octave version changing, and
  # that case is invisible: the record lands in data/__core__ under the same
  # version, overwriting the old one in place, so there is no new record for
  # the changes ledger to attribute anything to.  A digest cannot move.
  # Currently 11.3.0; bump it deliberately, see the drift check in "plan".
  OCTAVE_IMAGE: ghcr.io/gnu-octave/octave@sha256:b22abbe607c15ed821521ab9cf8a7c466dc47506730a0de9503bd554731b3e32
  SHARDS: 8

jobs:

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The pin above cannot go stale in silence.  Holding core still is the
      # point of it, but a package that begins shadowing a name core has only
      # just gained would go unrecorded until someone notices, so say so on
      # every run and leave the bump to a human.  Reading the digest of :latest
      # costs one unauthenticated request; it does not pull the image.
      - name: Check the pinned image against :latest
        continue-on-error: true
        run: |
          repo="gnu-octave/octave"
          token="$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:$repo:pull&service=ghcr.io" \
            | jq -r .token)"
          # HEAD, because the digest is a response header.  Asking for the body
          # would return whichever manifest the Accept list matched, and its
          # own digest is not the one the tag resolves to.
          latest="$(curl -fsSL -I \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/latest" \
            | tr -d '\r' \
            | awk 'tolower ($1) == "docker-content-digest:" {print $2}')"
          pinned="${OCTAVE_IMAGE##*@}"
          if [ -z "$latest" ]
          then
            echo "::warning::could not read the digest of :latest"
          elif [ "$latest" != "$pinned" ]
          then
            echo "::warning::OCTAVE_IMAGE is behind :latest ($latest);" \
                 "core is still measured against the pinned release"
          fi

      - name: Fetch the package index
        run: curl -fsSL -o packages.json
             https://gnu-octave.github.io/packages/packages.json

      - name: Decide what to harvest
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.packages }}
          FORCE: ${{ github.event.inputs.force }}
        run: python3 .github/scripts/plan.py

      - name: Upload the index
        uses: actions/upload-artifact@v7
        with:
          name: package-index
          path: packages.json

  harvest:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the index
        uses: actions/download-artifact@v8
        with:
          name: package-index

      - name: Pull the Octave image
        run: docker pull "$OCTAVE_IMAGE"

      - name: Harvest
        run: |
          mkdir -p out
          for p in ${{ matrix.packages }}
          do
            echo "::group::harvest $p"
            # One container per package.  A package that wedges the
            # interpreter, exhausts the disk or corrupts its own load path
            # cannot then affect the packages harvested after it, and each
            # scan starts from a load path holding nothing but core Octave.
            timeout 25m docker run --rm \
              --volume="$(pwd):/workdir:rw" \
              --workdir=/workdir \
              "$OCTAVE_IMAGE" \
              octave-cli --eval "addpath ('/workdir'); \
                harvest_package ('$p', '/workdir/packages.json', \
                                 '/workdir/out');" || true
            if [ ! -f "out/$p.json" ]
            then
              # The container died before it could write its own record.  The
              # version has to come from the index here, because a record
              # without one has nowhere to live in a version keyed store and
              # would be dropped -- leaving a package that dies in the runner
              # invisible rather than merely broken.
              v="$(jq -r --arg p "$p" '.[$p].versions[0].id // ""' \
                   packages.json)"
              s="$(jq -r --arg p "$p" '.[$p].versions[0].sha256 // ""' \
                   packages.json)"
              jq -n --arg p "$p" --arg v "$v" --arg s "$s" \
                '{package: $p, version: $v, sha256: $s,
                  status: "runner-failed",
                  message: "container exited without writing a record"}' \
                > "out/$p.json"
              echo "::error::$p: runner-failed"
            fi
            echo "::endgroup::"
          done

      - name: Upload the records
        uses: actions/upload-artifact@v7
        with:
          name: records-${{ matrix.shard }}
          path: out/*.json

  collect:
    needs: [plan, harvest]
    if: ${{ always() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download every shard
        uses: actions/download-artifact@v8
        with:
          pattern: records-*
          path: incoming
          merge-multiple: true

      # The merge needs to know which release of each package is the newest,
      # and the index is the authority on that.  Without it the merge falls
      # back to release dates, which is a guess.
      - name: Download the index
        uses: actions/download-artifact@v8
        with:
          name: package-index

      - name: Merge into the data set
        run: python3 .github/scripts/merge.py

      # Uploaded before the commit is attempted, not after.  A sweep costs
      # hours; if the push fails the data must survive it.
      - name: Upload the data set
        uses: actions/upload-artifact@v7
        with:
          name: functions-data
          path: data

      - name: Commit the data set
        run: |
          if [ ! -d data ]
          then
            echo "Nothing was harvested."
            exit 0
          fi
          # Stage first, then compare against the index.  "git diff" alone is
          # blind to untracked files, so on the first run -- when every record
          # is new -- it reports no change and nothing is ever committed.
          git add -A data
          if git diff --cached --quiet
          then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh harvested package functions"
          # A sweep takes hours, and anything pushed to main meanwhile leaves
          # this checkout behind, so the push is rejected.  Rebase onto
          # whatever is there now and try again: the data set is touched by
          # nobody else, so there is nothing for a rebase to conflict with.
          for attempt in 1 2 3
          do
            if git push
            then
              exit 0
            fi
            echo "Push rejected; rebasing onto the current main."
            git pull --rebase origin main
          done
          echo "::error::could not push the data set after three attempts"
          exit 1
